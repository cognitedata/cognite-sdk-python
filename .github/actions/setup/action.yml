name: 'Setup Python Environment'
description: 'Set up Python and install dependencies'
inputs:
  python_version:
    description: 'Python version to set up'
    required: false
    default: "3.10"
  extras:
    description: 'extra deps: poetry install -E whatever'
    required: false
    default: ""

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
      with:
        python-version: ${{ inputs.python_version }}
        cache: 'pip'

    - name: Setup cache for poetry
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
      with:
        path: |
          ~/.cache/pypoetry
          ~/.poetry
          !~/.cache/pypoetry/artifacts
          !~/.cache/pypoetry/repositories
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}-${{ inputs.python_version }}-${{ inputs.extras }}

    - name: Install dependencies
      shell: bash
      run: |
        # Keep poetry (pipx) and the project deps (.venv) in separate environments. Previously both lived in
        # the same interpreter, so 'poetry install' could up/downgrade poetry's own dependencies (e.g. virtualenv)
        # mid-install and break itself.
        python -m venv .venv
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
        else
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        fi
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
        pipx install poetry
        poetry config virtualenvs.in-project true
        poetry install --no-interaction --no-ansi ${{ inputs.extras }}
