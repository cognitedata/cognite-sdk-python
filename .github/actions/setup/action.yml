name: 'Setup Python Environment'
description: 'Set up Python with uv and install dependencies'
inputs:
  python_version:
    description: 'Python version to set up'
    required: false
    default: "3.10"
  extra:
    description: 'Optional dependency extra to install, for example pandas or all'
    required: false
    default: ""

runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.13.0"
        python-version: ${{ inputs.python_version }}
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: |
        if [ -n "${{ inputs.extra }}" ]; then
          uv sync --frozen --extra "${{ inputs.extra }}"
        else
          uv sync --frozen
        fi
