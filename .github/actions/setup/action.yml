name: 'Setup Python Environment'
description: 'Set up Python and install dependencies'
inputs:
  python_version:
    description: 'Python version to set up'
    required: false
    default: "3.10"
  extras:
    description: 'extra deps: poetry install -E whatever'
    required: false
    default: ""

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache virtualenv
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ inputs.python_version }}-${{ inputs.extras }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      shell: bash
      run: poetry install --no-interaction --no-ansi ${{ inputs.extras }}

    - name: Add virtualenv to PATH
      shell: bash
      run: |
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
        else
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        fi
